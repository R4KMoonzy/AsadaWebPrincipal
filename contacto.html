<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacto | ASADA Bijagua</title><meta name="description" content="ASADA Bijagua, Upala, Alajuela. Estamos para atender reportes y consultas de la comunidad.">
<link rel="icon" href="logo1.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body data-page="contacto"><div id="site-header"></div>
<main><section class="page-head"><div class="wrap"><div class="crumbs"><a href="index.html">Inicio</a> / Contacto</div><h1>Contacto</h1><p>Estamos para atender reportes y consultas de la comunidad.</p></div></section><section class="section "><div class="wrap"><div class="grid"><div class="c7"><h2 style="margin-bottom:24px">Reporte de averias y fugas</h2>
<form class="form" id="report-form"><div class="field"><label for="n">Nombre</label><input id="n" name="nombre" required></div>
<div class="field"><label for="ab">Numero de abonado</label><input id="ab" name="abonado" inputmode="numeric" required></div>
<div class="field"><label for="t">Telefono</label><input id="t" name="telefono" type="tel" required></div>
<div class="field"><label for="s">Sector o direccion</label><input id="s" name="sector" required></div>
<div class="field"><label for="k">Tipo de reporte</label><select id="k" name="tipo"><option>Fuga</option><option>Averia</option><option>Sin servicio</option><option>Agua turbia</option><option>Otro</option></select></div>
<div class="field"><label for="d">Descripcion</label><textarea id="d" name="descripcion" required></textarea></div>
<div><button class="btn dark" type="submit">Enviar reporte</button></div><p class="notice" id="report-msg" hidden></p></form></div>
<div class="c5"><h3>Emergencias</h3><p style="margin:10px 0 28px">Telefono: +506 0000-0000</p><h3>Oficina</h3><p style="margin:10px 0 28px">Bijagua, Upala, Alajuela<br>Horario: complete aqui</p><h3>Correo</h3><p style="margin-top:10px">info@asadabijagua.cr</p></div></div></div></section></main>
<div id="site-footer"></div><script type="module" src="app.js"></script></body></html>
